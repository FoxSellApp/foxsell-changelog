<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc"><title id="title">Checkout compatibility onboarding</title><desc id="desc">A guided checkout check leads merchants to a compatible setup or support.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#f15d22"/></marker></defs><rect width="1774" height="887" fill="#fff7f0"/><circle cx="160" cy="140" r="260" fill="#ffe8da"/><circle cx="1650" cy="820" r="300" fill="#f5eee9"/><text x="887" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1f1713">Confirm checkout compatibility with confidence</text><path d="M672 445h190M1116 445h130" fill="none" stroke="#f15d22" stroke-width="9" stroke-linecap="round" marker-end="url(#a)"/><g transform="translate(160 224)"><rect width="520" height="440" rx="34" fill="#fff" stroke="#eaded5" stroke-width="5"/><circle cx="72" cy="72" r="34" fill="#f15d22"/><text x="72" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">1</text><text x="126" y="66" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1f1713">How do customers</text><text x="126" y="101" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1f1713">complete checkout?</text><rect x="48" y="150" width="424" height="88" rx="20" fill="#fff1e8" stroke="#f15d22" stroke-width="4"/><circle cx="92" cy="194" r="15" fill="#f15d22"/><circle cx="92" cy="194" r="6" fill="#fff"/><text x="126" y="203" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1f1713">Shopify checkout</text><rect x="48" y="260" width="424" height="88" rx="20" fill="#f5eee9"/><circle cx="92" cy="304" r="15" fill="#fff" stroke="#b8aaa0" stroke-width="3"/><text x="126" y="313" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1f1713">Redirected checkout</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="18" fill="#6b5f57">Choose the path your store uses today</text></g><g transform="translate(862 300)"><rect width="260" height="290" rx="34" fill="#fff" stroke="#f15d22" stroke-width="5"/><circle cx="130" cy="92" r="55" fill="#e4f7ef"/><path d="M100 94l21 21 43-48" fill="none" stroke="#178a63" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1713">Clear guidance</text><text x="130" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6b5f57">before plan selection</text></g><g transform="translate(1250 224)"><rect width="370" height="440" rx="34" fill="#1f1713"/><circle cx="185" cy="112" r="60" fill="#f15d22"/><path d="M150 105h70v48h-42l-22 18 5-18h-11z" fill="#fff"/><text x="185" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Need help?</text><text x="185" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e8ddd6">Chat with FoxSell support</text><text x="185" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e8ddd6">directly from onboarding</text><rect x="54" y="336" width="262" height="62" rx="18" fill="#f15d22"/><text x="185" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Open support chat</text></g></svg>
