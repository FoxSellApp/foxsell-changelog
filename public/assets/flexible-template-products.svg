<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc"><title id="title">Flexible template product setup</title><desc id="desc">A merchant can connect an existing product or create a separate product for a template bundle.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#f15d22"/></marker></defs><rect width="1774" height="887" fill="#fff7f0"/><path d="M0 176h1774M0 354h1774M0 532h1774M0 710h1774M220 0v887M442 0v887M664 0v887M886 0v887M1108 0v887M1330 0v887M1552 0v887" stroke="#eaded5" opacity=".45"/><text x="887" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1f1713">Choose the product path that fits your offer</text><g transform="translate(120 270)"><rect width="390" height="330" rx="36" fill="#1f1713"/><rect x="52" y="48" width="286" height="178" rx="24" fill="#fff1e8"/><circle cx="195" cy="121" r="51" fill="#f15d22"/><path d="M161 155h68" stroke="#f15d22" stroke-width="14" stroke-linecap="round"/><text x="195" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">Template bundle</text></g><path d="M520 435h154M674 435c72 0 64-158 146-158h110M674 435c72 0 64 158 146 158h110" fill="none" stroke="#f15d22" stroke-width="9" stroke-linecap="round" marker-end="url(#a)"/><g transform="translate(945 173)"><rect width="690" height="245" rx="34" fill="#fff" stroke="#f15d22" stroke-width="5"/><circle cx="92" cy="92" r="48" fill="#ffe0cf"/><path d="M64 105h56V70H64zm-8 0h72v27H56z" fill="#f15d22"/><text x="168" y="84" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#1f1713">Link an existing product</text><text x="168" y="125" font-family="Arial,sans-serif" font-size="20" fill="#6b5f57">Reuse a product already in your Shopify catalog</text><rect x="168" y="158" width="260" height="48" rx="15" fill="#f5eee9"/><text x="298" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1f1713">Review linked product</text></g><g transform="translate(945 470)"><rect width="690" height="245" rx="34" fill="#fff" stroke="#eaded5" stroke-width="5"/><circle cx="92" cy="92" r="48" fill="#e4f7ef"/><path d="M92 64v56M64 92h56" stroke="#178a63" stroke-width="11" stroke-linecap="round"/><text x="168" y="84" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#1f1713">Create a separate product</text><text x="168" y="125" font-family="Arial,sans-serif" font-size="20" fill="#6b5f57">Start fresh with a dedicated bundle product</text><rect x="168" y="158" width="230" height="48" rx="15" fill="#f5eee9"/><text x="283" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1f1713">Create new product</text></g></svg>
